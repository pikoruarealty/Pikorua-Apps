server {
    listen 80;
    server_name apps.pikoruarealty.com;

    # The web root is a plain `git clone` of the repo; update with `git pull`.
    root /var/www/pikorua-apps;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # The repo itself is the web root, so never serve its internals.
    location ~ ^/(\.git|deploy)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The page is edited often; make browsers revalidate it so a pull shows up
    # immediately. Images change rarely and can be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
